<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rota EUA">
<meta name="theme-color" content="#14213d">
<title>Rota EUA – Motorhome</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="MarkerCluster.css">
<link rel="stylesheet" href="MarkerCluster.Default.css">
<style>
:root{--bg:#f6f4ef;--ink:#1d2433;--mut:#6b7280;--line:#e5e1d8;--card:#fff;--nav:#14213d;
--rv:#2563eb;--pub:#15803d;--free:#65a30d;--park:#ea580c;--dump:#7c3aed;--camp:#64748b;--ok:#16a34a;--inc:#d97706;--nao:#dc2626;
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
#map{position:fixed;inset:0;bottom:calc(58px + var(--safe-b));z-index:1}
#top{position:fixed;left:0;right:0;top:0;z-index:500;padding:calc(var(--safe-t) + 8px) 10px 8px;display:flex;gap:8px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.pill{background:rgba(255,255,255,.96);border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.18);padding:8px 12px;font-size:14px;font-weight:600;border:0;color:var(--ink)}
#dayPill{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
#fabs{position:fixed;right:10px;bottom:calc(72px + var(--safe-b));z-index:500;display:flex;flex-direction:column;gap:10px}
.fab{width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:22px;display:flex;align-items:center;justify-content:center}
.fab.on{background:#2563eb;color:#fff}
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(58px + var(--safe-b));padding-bottom:var(--safe-b);background:var(--nav);display:flex;z-index:900}
#nav button{flex:1;background:none;border:0;color:#aab3c5;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#nav button span{font-size:20px}
#nav button.act{color:#fff}
.panel{position:fixed;left:0;right:0;top:0;bottom:calc(58px + var(--safe-b));background:var(--bg);z-index:800;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--safe-t) + 12px) 14px 30px;display:none}
.panel.show{display:block}
.panel h2{margin:4px 0 12px;font-size:22px}
.sheet{position:fixed;left:0;right:0;bottom:calc(58px + var(--safe-b));z-index:950;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.25);max-height:72vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(110%);transition:transform .22s ease;padding:6px 16px 18px}
.sheet{visibility:hidden}.sheet.show{transform:none;visibility:visible}
.grab{width:40px;height:5px;border-radius:3px;background:#d4d4d4;margin:4px auto 8px}
.x{position:sticky;top:0;float:right;border:0;background:#eee;border-radius:50%;width:30px;height:30px;font-size:16px}
.sheet h3{margin:2px 0 6px;font-size:19px;padding-right:36px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.b{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;color:#fff}
.b.lt{background:#f1efe9;color:var(--ink)}
.rows{border-top:1px solid var(--line)}
.row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.row .k{width:92px;flex:none;color:var(--mut)}
.notes{margin:10px 0;padding-left:18px;font-size:14px;line-height:1.4}
.src{font-size:12px;color:var(--mut)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{display:block;text-align:center;text-decoration:none;padding:11px 8px;border-radius:12px;font-weight:700;font-size:14px;background:#eef2ff;color:#1e3a8a;border:0}
.btn.pri{background:#2563eb;color:#fff;grid-column:1/-1}
.rvbtn{width:100%;margin-top:12px;background:#fef3c7;color:#92400e}
.rev{border-bottom:1px solid var(--line);padding:10px 0;font-size:14px;line-height:1.4}
.rev .rh{display:flex;justify-content:space-between;margin-bottom:3px}
.rev .st{color:#d97706;letter-spacing:1px}
.fico{display:inline-flex;width:28px;height:28px;flex:none}
.mk{width:28px;height:28px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.mk.v{width:34px;height:34px;border:3px solid #facc15;font-size:14px}
.mk .dot{position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;border:2px solid #fff}
.stop{background:#14213d;color:#fff;border-radius:10px;padding:2px 6px;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.4);border:2px solid #fff}
.me{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.25)}
.filt label{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:15px}
.filt input{width:22px;height:22px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.day{background:var(--card);border-radius:16px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dayh{padding:12px 14px;background:#14213d;color:#fff;display:flex;justify-content:space-between;align-items:center}
.dayh.today{background:#2563eb}
.dayh small{opacity:.8}
.it{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.it .mk{flex:none}
.it .t{flex:1;min-width:0}
.it .t b{display:block;font-size:14px}
.it .t span{font-size:12px;color:var(--mut)}
.leg{font-size:12px;color:var(--mut);padding:8px 14px}
.av h4{margin:0 0 6px;font-size:16px}
.av p{margin:0;font-size:14px;line-height:1.45}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);font-size:16px;margin-bottom:10px;background:#fff}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.seg button.on{background:#14213d;color:#fff;border-color:#14213d}
.leaflet-control-attribution{font-size:9px}
.marker-cluster div{font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;margin:6px 0 4px}
.legend span{display:flex;align-items:center;gap:5px}
.muted{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <button class="pill" id="dayPill" onclick="openTab('roteiro')">🗓️ Roteiro</button>
  <button class="pill" onclick="openFilters()">⚙️ Filtros</button>
</div>
<div id="fabs">
  <button class="fab" id="fabLoc" onclick="toggleFollow()" title="Minha localização">📍</button>
  <button class="fab" onclick="fitRoute()" title="Ver rota inteira">🗺️</button>
</div>

<div class="panel" id="p-roteiro"><h2>Roteiro dia a dia</h2><div id="rotList"></div></div>
<div class="panel" id="p-perto"><h2>Perto de mim</h2>
  <input class="search" id="q" placeholder="Buscar pelo nome (ex.: Walmart, KOA, Zion)" oninput="renderNear()">
  <div class="seg" id="nearSeg"></div>
  <div class="muted" id="nearInfo"></div><div id="nearList"></div></div>
<div class="panel" id="p-avisos"><h2>Avisos importantes</h2><div id="avList"></div></div>
<div class="panel filt" id="p-filtros"><h2>O que mostrar no mapa</h2><div id="filtList"></div>
  <p class="muted">⭐ Borda amarela = local pesquisado (preço, reserva, inverno e comentários conferidos em <span id="verTxt"></span>). Os outros vêm do OpenStreetMap e não foram conferidos um a um.</p>
  <div class="legend" id="legend"></div>
</div>

<div class="sheet" id="sheet"><div class="grab"></div><button class="x" onclick="closeSheet()">✕</button><div id="sheetBody"></div></div>

<nav id="nav">
  <button class="act" data-t="mapa" onclick="openTab('mapa')"><span>🗺️</span>Mapa</button>
  <button data-t="roteiro" onclick="openTab('roteiro')"><span>🗓️</span>Roteiro</button>
  <button data-t="perto" onclick="openTab('perto')"><span>📍</span>Perto</button>
  <button data-t="avisos" onclick="openTab('avisos')"><span>⚠️</span>Avisos</button>
</nav>

const CAT = {
  rv:{n:'RV park (pago)',c:'var(--rv)',hex:'#2563eb',i:'RV'},
  pub:{n:'Camping público / estadual / nacional',c:'var(--pub)',hex:'#15803d',i:'⛺'},

  camp:{n:'Outros campings (tipo não confirmado)',c:'var(--camp)',hex:'#64748b',i:'⛺'}
};
const SUB = {walmart:'Walmart',casino:'Cassino',truck:'Truck stop',rest:'Rest area',cracker:'Cracker Barrel',outdoor:'Loja outdoor'};
const ST = {ok:['🟢 Pernoite liberado (relatos)','var(--ok)'],inc:['🟡 Incerto – confirme','var(--inc)'],nao:['🔴 Não permite','var(--nao)']};
const TRIP_YEAR = d => { const [dd,mm]=d.split('/').map(Number); return new Date(mm===12?2026:2027, mm-1, dd); };
const store = { get(k,d){ try{const v=localStorage.getItem('rotaeua_'+k); return v?JSON.parse(v):d;}catch(e){return d;} }, set(k,v){ try{localStorage.setItem('rotaeua_'+k,JSON.stringify(v));}catch(e){} } };
let F = store.get('filters', {rv:true,pub:true,free:true,park:true,dump:true,camp:false,onlyV:false,hideNao:false});
let me = null, follow = false, watchId = null, meMarker = null, nearCat = 'all';

const map = L.map('map',{zoomControl:false, preferCanvas:true}).setView([36.2,-115.5],6);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
L.polyline(DATA.route,{color:'#14213d',weight:5,opacity:.75}).addTo(map);
L.polyline(DATA.route,{color:'#60a5fa',weight:2,opacity:.9,dashArray:'6 8'}).addTo(map);
const routeBounds = L.latLngBounds(DATA.route);

// stops
const stopLayer = L.layerGroup().addTo(map);
DATA.stops.forEach((s,i)=>{
  const ic = L.divIcon({className:'',html:`<div class="stop">${s.pn?'🌙 ':''}D${s.dia} ${s.n.split('(')[0].split('–')[0].trim()}</div>`,iconSize:null,iconAnchor:[0,10]});
  L.marker([s.lat,s.lon],{icon:ic,zIndexOffset:-500}).addTo(stopLayer).on('click',()=>showStop(i));
});
map.on('zoomend',()=>{ if(map.getZoom()<7) map.removeLayer(stopLayer); else if(!map.hasLayer(stopLayer)) map.addLayer(stopLayer); });

function icon(p){
  const c = CAT[p.c]||CAT.camp;
  const dot = p.st ? `<span class="dot" style="background:${ST[p.st][1]}"></span>` : '';
  const txt = p.c==='park' ? ({walmart:'W',casino:'🎰',truck:'⛽',rest:'R',cracker:'CB',outdoor:'P'}[p.s]||'P') : c.i;
  return L.divIcon({className:'',html:`<div class="mk${p.v?' v':''}" style="background:${c.hex};position:relative">${txt}${dot}</div>`,iconSize:p.v?[34,34]:[28,28],iconAnchor:p.v?[17,17]:[14,14]});
}
const cluster = L.markerClusterGroup({maxClusterRadius:40,disableClusteringAtZoom:11,showCoverageOnHover:false,chunkedLoading:true});
const vLayer = L.markerClusterGroup({maxClusterRadius:28,disableClusteringAtZoom:9,showCoverageOnHover:false,iconCreateFunction:c=>L.divIcon({className:'',html:`<div class="mk v" style="background:#a16207">${c.getChildCount()}</div>`,iconSize:[34,34]})});
map.addLayer(cluster); map.addLayer(vLayer);
const markers = {};
function visible(p){
  if(!F[p.c]) return false;
  if(F.onlyV && !p.v) return false;
  if(F.hideNao && p.st==='nao') return false;
  return true;
}
function draw(){
  cluster.clearLayers(); vLayer.clearLayers();
  const arr=[];
  DATA.places.forEach(p=>{
    if(!visible(p)) return;
    let m = markers[p.id];
    if(!m){ m = L.marker([p.lat,p.lon],{icon:icon(p),zIndexOffset:p.v?1000:0}); m.on('click',()=>openPlace(p.id)); markers[p.id]=m; }
    if(p.v) vLayer.addLayer(m); else arr.push(m);
  });
  cluster.addLayers(arr);
}
const byId = {}; DATA.places.forEach(p=>byId[p.id]=p);

function km(a,b,c,d){const R=6371,t=Math.PI/180,x=Math.sin((c-a)*t/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin((d-b)*t/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function row(k,v){ return v?`<div class="row"><div class="k">${k}</div><div>${esc(v)}</div></div>`:''; }

function openPlace(id, fly){
  const p = byId[id]; if(!p) return;
  if(fly){ openTab('mapa'); map.setView([p.lat,p.lon], Math.max(map.getZoom(),13)); }
  const c = CAT[p.c]||CAT.camp;
  let b = `<span class="b" style="background:${c.hex}">${c.n}${p.s&&SUB[p.s]?' · '+SUB[p.s]:''}</span>`;
  if(p.st) b += `<span class="b" style="background:${ST[p.st][1]}">${ST[p.st][0]}</span>`;
  if(p.v) b += `<span class="b" style="background:#a16207">⭐ Pesquisado</span>`; else b+=`<span class="b lt">Dados do mapa (não conferido)</span>`;
  if(p.p) b += `<span class="b lt">💲 ${esc(p.p)}</span>`;
  let dist = me ? `${km(me[0],me[1],p.lat,p.lon).toFixed(1)} km em linha reta` : (p.k!=null?`${p.k} km da rota`:'');
  let h = `<h3>${esc(p.n)}</h3><div class="badges">${b}</div><div class="rows">`+
    row('Preço',p.p)+row('Reserva',p.r)+row('Ligações',p.h)+row('Dump',p.dp)+row('Água',p.ag)+row('Inverno',p.w)+row('Tam. máx.',p.mx)+
    row('Dias',p.d&&p.d.length?p.d.join(', '):'')+row('Operador',p.op)+row('Endereço',p.ad)+row('Telefone',p.tel)+row('Distância',dist)+`</div>`;
  if(p.o&&p.o.length) h += `<ul class="notes">${p.o.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if(p.f&&p.f.length) h += `<div class="src">Fontes: ${esc(p.f.join(' · '))}${p.v?' – conferido em '+DATA.ver:''}</div>`;
  const ll = `${p.lat},${p.lon}`;
  h += `<div class="btns">
    <a class="btn pri" href="https://www.google.com/maps/dir/?api=1&destination=${ll}&travelmode=driving" target="_blank" rel="noopener">🧭 Ir com Google Maps</a>
    <a class="btn" href="https://maps.apple.com/?daddr=${ll}&dirflg=d" target="_blank" rel="noopener">Apple Maps</a>
    <a class="btn" href="https://waze.com/ul?ll=${ll}&navigate=yes" target="_blank" rel="noopener">Waze</a>
    ${p.l?`<a class="btn" href="${esc(p.l)}" target="_blank" rel="noopener">🌐 Site / reservar</a>`:''}
    ${p.tel?`<a class="btn" href="tel:${esc(p.tel)}">📞 Ligar</a>`:''}
    <a class="btn" href="googlechromes://www.google.com/search?q=${encodeURIComponent(p.n+' RV')}">🔎 Pesquisar no Chrome</a>
  </div>`;
  if(p.rv&&p.rv.length){
    h = h.replace('<div class="btns">', `<button class="btn rvbtn" onclick="showRev('${p.id}')">💬 Comentários recentes (${p.rv.length}) – em português</button><div class="btns">`);
  }
  document.getElementById('sheetBody').innerHTML = h;
  document.getElementById('sheet').scrollTop=0;
  document.getElementById('sheet').classList.add('show');
}
function showRev(id){
  const p=byId[id]; const [src,url,avg,n]=p.rs||[];
  const stars=s=>s?'★'.repeat(+s)+'☆'.repeat(5-+s):'';
  let h=`<h3>💬 ${esc(p.n)}</h3><div class="muted">Últimos comentários de viajantes, resumidos e traduzidos. Fonte: ${esc(src||'')}${avg?` · nota média ${esc(avg)} (${esc(n)} avaliações)`:''}.</div>`;
  h+=p.rv.map(([d,s,t])=>`<div class="rev"><div class="rh"><b>${fmtD(d)}</b><span class="st">${stars(s)}</span></div><div>${esc(t)}</div></div>`).join('');
  h+=`<div class="btns"><button class="btn" onclick="openPlace('${p.id}')">← Voltar</button>${url?`<a class="btn" href="${esc(url.replace(/^https:/,'googlechromes:'))}">Ver todos no Chrome</a>`:''}</div>`;
  document.getElementById('sheetBody').innerHTML=h; document.getElementById('sheet').scrollTop=0;
}
function fmtD(d){ if(!/^\d{4}-\d{2}/.test(d)) return d; const [y,m,dd]=d.split('-'); const M=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m-1]; return (dd?(+dd)+' ':'')+M+'/'+y; }
function closeSheet(){ document.getElementById('sheet').classList.remove('show'); }
map.on('click', closeSheet);

function showStop(i){
  const s = DATA.stops[i];
  const near = DATA.places.filter(p=>p.v && p.d && p.d.includes(s.data));
  let h = `<h3>Dia ${s.dia} · ${s.data} – ${esc(s.n)}</h3><div class="badges"><span class="b" style="background:#14213d">${s.pn?'🌙 Pernoite':'Parada'}</span></div>`;
  if(near.length){ h += `<div class="muted">Opções pesquisadas para esta noite:</div>` + near.map(itemHTML).join(''); }
  document.getElementById('sheetBody').innerHTML = h;
  document.getElementById('sheet').classList.add('show');
}
function itemHTML(p){
  const c = CAT[p.c]||CAT.camp;
  const st = p.st?` · ${ST[p.st][0]}`:'';
  return `<div class="it" onclick="openPlace('${p.id}',true)"><div class="mk${p.v?' v':''}" style="background:${c.hex}">${p.c==='park'?'P':c.i}</div><div class="t"><b>${esc(p.n)}</b><span>${[p.p,p.h].filter(x=>x&&x!=='—').map(esc).join(' · ')}${st}</span></div><div>›</div></div>`;
}

// tabs
function openTab(t){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('act',b.dataset.t===t));
  ['roteiro','perto','avisos','filtros'].forEach(x=>document.getElementById('p-'+x).classList.toggle('show',x===t));
  closeSheet();
  if(t==='perto') renderNear();
  if(t==='mapa') setTimeout(()=>map.invalidateSize(),50);
}
function openFilters(){ openTab('filtros'); document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('act')); }

// roteiro
function todayStr(){ const d=new Date(); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
function renderRot(){
  const days = {}; DATA.stops.forEach((s,i)=>{ (days[s.dia]=days[s.dia]||{dia:s.dia,data:s.data,stops:[]}).stops.push({...s,i}); });
  const td = todayStr(); let h='';
  const allDates = []; for(let d=new Date(2026,11,14); d<=new Date(2027,0,13); d.setDate(d.getDate()+1)) allDates.push(String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'));
  let lastNight = 'Huntington Beach';
  allDates.forEach((dt,idx)=>{
    const dd = Object.values(days).find(x=>x.data===dt);
    const isT = dt===td;
    if(dd){
      const night = dd.stops.filter(s=>s.pn).map(s=>s.n).pop();
      if(night) lastNight = night;
      const legs = dd.stops.map(s=>s.i).filter(i=>i>0).map(i=>DATA.legs[i-1]).filter(Boolean);
      const kmT = legs.reduce((a,l)=>a+l.km,0), hT = legs.reduce((a,l)=>a+l.h,0);
      h += `<div class="day" id="d-${dt.replace('/','-')}"><div class="dayh${isT?' today':''}"><div><b>Dia ${idx+1} · ${dt}</b><br><small>${dd.stops.map(s=>esc(s.n.split('(')[0].trim())).join(' → ')}</small></div><button class="pill" onclick="flyStop(${dd.stops[dd.stops.length-1].i})">Mapa</button></div>`;
      if(kmT) h += `<div class="leg">🚐 ~${kmT} km · ~${hT.toFixed(1)} h de direção (sem paradas)</div>`;
    } else {
      h += `<div class="day" id="d-${dt.replace('/','-')}"><div class="dayh${isT?' today':''}"><div><b>Dia ${idx+1} · ${dt}</b><br><small>Dia livre em ${esc(lastNight.split('(')[0].trim())}</small></div></div>`;
    }
    const opts = DATA.places.filter(p=>p.v && p.d && p.d.includes(dt));
    opts.sort((a,b)=>({free:0,park:1,pub:2,rv:3,dump:4}[a.c]-({free:0,park:1,pub:2,rv:3,dump:4}[b.c])));
    h += opts.map(itemHTML).join('') + `</div>`;
  });
  document.getElementById('rotList').innerHTML = h;
  const tripDay = allDates.indexOf(td);
  document.getElementById('dayPill').textContent = tripDay>=0 ? `🗓️ Hoje: Dia ${tripDay+1} (${td})` : '🗓️ Roteiro 14/12 → 13/01';
}
function flyStop(i){ const s=DATA.stops[i]; openTab('mapa'); map.setView([s.lat,s.lon],11); showStop(i); }

// perto
function renderNear(){
  const seg = document.getElementById('nearSeg');
  const opts = [['all','Todos'],['free','Grátis'],['park','Estacionar'],['pub','Públicos'],['rv','RV parks'],['dump','Dump']];
  seg.innerHTML = opts.map(([k,n])=>`<button class="${nearCat===k?'on':''}" onclick="nearCat='${k}';renderNear()">${n}</button>`).join('');
  const q = document.getElementById('q').value.trim().toLowerCase();
  const ref = me || [map.getCenter().lat, map.getCenter().lng];
  document.getElementById('nearInfo').textContent = me ? 'Distância em linha reta a partir de você.' : 'GPS desligado – distâncias a partir do centro do mapa. Toque em 📍 no mapa para ativar.';
  let arr = DATA.places.filter(p=>visible(p) || q);
  if(nearCat!=='all') arr = arr.filter(p=>p.c===nearCat);
  if(q) arr = arr.filter(p=>p.n.toLowerCase().includes(q));
  arr = arr.map(p=>[km(ref[0],ref[1],p.lat,p.lon),p]).sort((a,b)=>a[0]-b[0]).slice(0,60);
  document.getElementById('nearList').innerHTML = arr.map(([d,p])=>itemHTML(p).replace('<div>›</div>',`<div class="muted">${d<10?d.toFixed(1):Math.round(d)} km</div>`)).join('') || '<p class="muted">Nada encontrado.</p>';
}

// avisos
document.getElementById('avList').innerHTML = DATA.avisos.map(a=>`<div class="card av"><h4>${esc(a.t)}</h4><p>${esc(a.x)}</p></div>`).join('') +
  `<div class="card av"><h4>ℹ️ Sobre os dados</h4><p>Os locais com ⭐ foram pesquisados em ${DATA.ver} (sites oficiais, Campendium, iOverlander, The Dyrt, AllStays, fóruns). Preços e regras mudam: confirme antes de ir. Os demais pontos vêm do OpenStreetMap. Pernoite em estacionamento: 🟢 liberado segundo relatos recentes, 🟡 incerto, 🔴 proibido.</p></div>`;

// filtros
function renderFilt(){
  const items = Object.entries(CAT).map(([k,c])=>`<label><input type="checkbox" ${F[k]?'checked':''} onchange="F['${k}']=this.checked;saveF()"><span class="mk" style="background:${c.hex}">${c.i}</span><span>${c.n} <span class="muted">(${DATA.places.filter(p=>p.c===k).length})</span>${k==='park'?'<br><span class="muted">W Walmart · 🎰 Cassino · ⛽ Truck stop · R Rest area · CB Cracker Barrel</span>':''}</span></label>`).join('');
  document.getElementById('filtList').innerHTML = items +
   `<label><input type="checkbox" ${F.onlyV?'checked':''} onchange="F.onlyV=this.checked;saveF()">⭐ Só locais pesquisados</label>`+
   `<label><input type="checkbox" ${F.hideNao?'checked':''} onchange="F.hideNao=this.checked;saveF()">Esconder estacionamentos que proíbem</label>`;
  document.getElementById('legend').innerHTML = `<span><span class="mk v" style="background:#2563eb;width:28px;height:28px">RV</span>Borda amarela = pesquisado</span>` + Object.values(ST).map(s=>`<span><span class="sw" style="background:${s[1]}"></span>${s[0].replace(/^\S+ /,'')}</span>`).join('') + `<span class="muted" style="width:100%">A bolinha colorida no canto do ícone mostra se o estacionamento permite pernoite.</span>`;
  document.getElementById('verTxt').textContent = DATA.ver;
}
function saveF(){ store.set('filters',F); draw(); }

// GPS
function toggleFollow(){
  if(!navigator.geolocation){ alertBox('Este aparelho não oferece localização.'); return; }
  follow = !follow;
  document.getElementById('fabLoc').classList.toggle('on',follow);
  if(follow){
    if(me) map.setView(me, Math.max(map.getZoom(),11));
    if(watchId===null){
      watchId = navigator.geolocation.watchPosition(pos=>{
        me = [pos.coords.latitude,pos.coords.longitude];
        if(!meMarker) meMarker = L.marker(me,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:3000}).addTo(map);
        else meMarker.setLatLng(me);
        if(follow) map.panTo(me,{animate:true});
      }, err=>{ follow=false; document.getElementById('fabLoc').classList.remove('on'); alertBox('Não consegui sua localização: '+err.message+'. Libere a localização para o app nas configurações do iPhone.'); }, {enableHighAccuracy:true, maximumAge:10000, timeout:20000});
    }
  }
}
map.on('dragstart',()=>{ if(follow){ follow=false; document.getElementById('fabLoc').classList.remove('on'); } });
function alertBox(t){ document.getElementById('sheetBody').innerHTML = `<h3>Aviso</h3><p>${esc(t)}</p>`; document.getElementById('sheet').classList.add('show'); }
function fitRoute(){ map.fitBounds(routeBounds,{padding:[20,20]}); }

renderFilt(); renderRot(); draw(); fitRoute();
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
